name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version, Windows version, fan models
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened
      description: Steps, what you expected and what you saw.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Relevant lines from %LOCALAPPDATA%\WirelessCanvasRGB\application.log
      render: text
